<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audio Transcribe</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Local Whisper Workstation</p>
          <h1 id="page-title">Audio Transcribe</h1>
          <p class="lede">本地 large-v3 模型驱动的面试录音转写台。上传文件或粘贴视频链接，选择语言、格式和时间轴，一次生成可下载文档。</p>
        </div>
        <div class="status-strip" aria-label="运行信息">
          <span>本地优先</span>
          <span>上传 / YouTube / Bilibili</span>
          <span>Word / TXT / Markdown</span>
        </div>
      </section>

      <section class="workspace">
        <form id="job-form" class="panel" aria-label="创建转写任务">
          <div class="panel-head">
            <div>
              <h2>新建任务</h2>
              <p>文件和链接二选一；如果同时填写，会优先处理上传文件。</p>
            </div>
            <button class="icon-button" type="button" id="reset-button" aria-label="清空表单" title="清空表单">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6"/></svg>
            </button>
          </div>

          <label class="dropzone" for="file-input">
            <input id="file-input" name="file" type="file" accept=".mp3,.m4a,.wav,.flac,.aac,.ogg,.mp4,.mov,.mkv,.webm,.avi" />
            <span class="drop-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0 4 4m-4-4-4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            </span>
            <strong id="file-label">选择本地音频或视频</strong>
            <small>支持 mp3、m4a、wav、flac、mp4、mov、mkv、webm 等</small>
          </label>

          <label class="field">
            <span>视频链接</span>
            <input id="source-url" name="source_url" type="url" placeholder="https://www.youtube.com/watch?v=... 或 Bilibili 链接" />
          </label>

          <div class="grid two">
            <label class="field">
              <span>转换语言</span>
              <select name="language" id="language">
                <option value="auto">自动识别</option>
                <option value="zh">中文</option>
                <option value="ja">日语</option>
                <option value="en">英语</option>
                <option value="ko">韩语</option>
              </select>
            </label>
            <label class="switch">
              <input type="checkbox" name="include_timestamps" checked />
              <span></span>
              <b>带时间轴</b>
            </label>
          </div>

          <fieldset class="formats">
            <legend>转录文件格式</legend>
            <label><input type="checkbox" name="formats" value="docx" checked /> <span>Word</span></label>
            <label><input type="checkbox" name="formats" value="txt" checked /> <span>TXT</span></label>
            <label><input type="checkbox" name="formats" value="md" /> <span>Markdown</span></label>
          </fieldset>

          <details class="advanced">
            <summary>截取时间段</summary>
            <div class="grid two">
              <label class="field">
                <span>开始时间</span>
                <input name="start_time" type="time" step="1" value="00:00:00" aria-label="选择开始时间" />
              </label>
              <label class="field">
                <span>结束时间</span>
                <input name="end_time" type="time" step="1" value="00:00:00" aria-label="选择结束时间" />
              </label>
            </div>
          </details>

          <button class="primary" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18"/></svg>
            开始转写
          </button>
        </form>

        <aside class="panel monitor" aria-live="polite">
          <div class="panel-head">
            <div>
              <h2>任务列表</h2>
              <p id="job-summary">等待创建任务</p>
            </div>
            <button class="icon-button" type="button" id="jobs-refresh-button" aria-label="刷新任务列表" title="刷新任务列表">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6"/></svg>
            </button>
          </div>

          <div id="jobs-list" class="jobs-list"></div>

          <div class="model-card" aria-live="polite">
            <div>
              <h3>模型状态</h3>
              <label class="model-selector">
                <span>选择模型</span>
                <select id="model-select" aria-label="选择语音转换模型"></select>
              </label>
              <p id="model-message">正在检测 large-v3 模型</p>
              <span class="device-pill" id="model-device">运行设备：检测中</span>
              <small id="model-path"></small>
            </div>
            <div class="model-actions">
              <button class="secondary" type="button" id="model-refresh-button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6"/></svg>
                <span id="model-refresh-label">重新检测</span>
              </button>
              <button class="secondary" type="button" id="model-download-button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16"/></svg>
                <span id="model-download-label">下载模型</span>
              </button>
            </div>
          </div>
        </aside>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
